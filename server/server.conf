# Kumo backend (template: deploy.sh fills __KUMO_PASS__ from server/.env): Suwayomi-Server, headless, bound to localhost; Tailscale Funnel 8443 -> 4567 (expose.sh). Lives in /home/shad/kumo/data/server.conf
server.ip = "127.0.0.1"
server.port = 4567
server.webUIEnabled = false
server.initialOpenInBrowserEnabled = false
server.systemTrayEnabled = false
server.kcefEnabled = true
server.downloadsPath = "/home/shad/kumo/manga"
server.downloadAsCbz = true
server.localSourcePath = "/home/shad/kumo/local"
server.backupPath = "/home/shad/kumo/backups"
server.extensionStores = ["https://github.com/keiyoushi/extensions/raw/repo/index.pb"]
server.maxSourcesInParallel = 3
server.globalUpdateInterval = 12.0
server.authMode = UI_LOGIN
server.authUsername = "shad"
server.authPassword = "__KUMO_PASS__"
server.jwtTokenExpiry = "30m"
server.jwtRefreshExpiry = "60d"
